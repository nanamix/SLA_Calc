apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sla-calculator
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
        - redis-server
        - /etc/redis/redis.conf
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
              optional: true
        volumeMounts:
        - name: redis-config
          mountPath: /etc/redis
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          fsGroup: 999
      volumes:
      - name: redis-config
        configMap:
          name: redis-config-file
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: sla-calculator
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: sla-calculator
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config-file
  namespace: sla-calculator
data:
  redis.conf: |
    # Redis 설정 파일 - SLA Calculator용 최적화
    
    port 6379
    bind 0.0.0.0
    protected-mode no
    timeout 300
    tcp-keepalive 300
    
    # 메모리 관리
    maxmemory 400mb
    maxmemory-policy allkeys-lru
    maxmemory-samples 5
    
    # 지속성 설정
    save 900 1
    save 300 10
    save 60 10000
    rdbcompression yes
    rdbchecksum yes
    dbfilename sla-calculator.rdb
    
    # AOF 설정
    appendonly yes
    appendfilename "sla-calculator.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    
    # 로그 설정
    loglevel notice
    logfile ""
    
    # 클라이언트 연결 설정
    maxclients 1000
    
    # 슬로우 로그 설정
    slowlog-log-slower-than 10000
    slowlog-max-len 128
    
    # 키 만료 설정
    hz 10
    
    # 데이터베이스 개수
    databases 16
    
    # 네트워킹
    tcp-backlog 511
    
    # 메모리 사용량 최적화
    hash-max-ziplist-entries 512
    hash-max-ziplist-value 64
    list-max-ziplist-size -2
    list-compress-depth 0
    set-max-intset-entries 512
    zset-max-ziplist-entries 128
    zset-max-ziplist-value 64
    
    # 활성 재해싱
    activerehashing yes
    
    # 클라이언트 출력 버퍼 제한
    client-output-buffer-limit normal 0 0 0
    client-output-buffer-limit replica 256mb 64mb 60
    client-output-buffer-limit pubsub 32mb 8mb 60
    
    # 알림 설정 (키 만료 이벤트)
    notify-keyspace-events "Ex"
    
    # 보안 명령어 비활성화
    rename-command FLUSHDB ""
    rename-command FLUSHALL ""
    rename-command KEYS ""