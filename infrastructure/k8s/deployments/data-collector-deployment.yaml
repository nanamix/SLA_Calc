apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-collector
  namespace: sla-calculator
  labels:
    app: data-collector
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-collector
      version: v1
  template:
    metadata:
      labels:
        app: data-collector
        version: v1
    spec:
      containers:
      - name: data-collector
        image: sla-calculator/data-collector:latest
        ports:
        - containerPort: 8001
        env:
        - name: CELERY_BROKER_URL
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: url
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: database-config
              key: host
        - name: PROMETHEUS_URL
          valueFrom:
            configMapKeyRef:
              name: external-apis-config
              key: prometheus-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: data-collector-service
  namespace: sla-calculator
  labels:
    app: data-collector
spec:
  selector:
    app: data-collector
  ports:
  - port: 8001
    targetPort: 8001
    name: http
  type: ClusterIP