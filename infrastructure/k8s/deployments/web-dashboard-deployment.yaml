apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-dashboard
  namespace: sla-calculator
  labels:
    app: web-dashboard
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-dashboard
      version: v1
  template:
    metadata:
      labels:
        app: web-dashboard
        version: v1
    spec:
      containers:
      - name: web-dashboard
        image: sla-calculator/web-dashboard:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-dashboard-service
  namespace: sla-calculator
  labels:
    app: web-dashboard
spec:
  selector:
    app: web-dashboard
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP