apiVersion: v1
kind: ConfigMap
metadata:
  name: database-config
  namespace: sla-calculator
data:
  host: "postgresql-service.sla-calculator.svc.cluster.local"
  port: "5432"
  database: "sla_calculator"
  username: "sla_user"
  max_connections: "20"
  connection_timeout: "30"
  idle_timeout: "300"
  ssl_mode: "prefer"
  # 데이터베이스 풀 설정
  pool_min_size: "5"
  pool_max_size: "20"
  pool_acquire_timeout: "30"
  # 마이그레이션 설정
  migration_table: "마이그레이션히스토리"
  auto_migrate: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: sla-calculator
data:
  host: "redis-service.sla-calculator.svc.cluster.local"
  port: "6379"
  url: "redis://redis-service.sla-calculator.svc.cluster.local:6379"
  max_connections: "10"
  connection_timeout: "5"
  command_timeout: "10"
  retry_attempts: "3"
  # 캐시 설정
  default_ttl: "3600"  # 1시간
  max_memory_policy: "allkeys-lru"
  # 키 네이밍 전략
  key_prefix: "sla_calc"
  key_separator: ":"
  # 캐시 네임스페이스
  metrics_namespace: "metrics"
  sessions_namespace: "sessions"
  alerts_namespace: "alerts"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-apis-config
  namespace: sla-calculator
data:
  prometheus-url: "http://prometheus.monitoring.svc.cluster.local:9090"
  grafana-url: "http://grafana.monitoring.svc.cluster.local:3000"
  pingdom-api-url: "https://api.pingdom.com/api/3.1"